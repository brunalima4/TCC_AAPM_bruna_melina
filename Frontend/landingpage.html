<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial - AAPM SENAI</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f11815;
            --primary-dark: #b31210;
            --bg-body: #f8faff;
            --sidebar-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-sub: #64748b;
            --radius: 24px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--bg-body);
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            padding: 20px;
        }

        .sidebar.closed {
            width: 0;
            padding: 0;
            opacity: 0;
            pointer-events: none;
        }

        .menu-header {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-links a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 18px;
            text-decoration: none;
            color: var(--text-sub);
            font-size: 16px;
            font-weight: 600;
            border-radius: 16px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background-color: #fff1f1;
            color: var(--primary);
        }

        .nav-links a.admin-btn {
            margin-top: 10px;
            background-color: #f1f5f9;
            color: var(--primary);
            border: 1px dashed var(--primary);
        }

        /* --- BOTÃO MENU --- */
        .btn-toggle {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-sub);
            padding: 10px;
            border-radius: 12px;
            transition: 0.3s;
            display: flex;
            align-items: center;
        }

        /* --- CONTEÚDO PRINCIPAL --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .top-header {
            height: 90px;
            background-color: #ffffff;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            position: relative;
        }

        /* --- BUSCA ESTILIZADA --- */
        .search-area {
            background: #f1f5f9;
            padding: 12px 20px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 250px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .search-area:focus-within {
            border-color: var(--primary);
            background: #ffffff;
            width: 320px;
            box-shadow: 0 10px 25px rgba(241, 24, 21, 0.1);
        }

        .search-area input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-weight: 600;
            color: var(--text-main);
        }

        /* --- LOGO CENTRAL --- */
        .logo-central {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1;
        }

        .logo-text { 
            color: var(--primary); 
            font-weight: 800; 
            font-size: 32px;
            letter-spacing: -1px;
        }

        .logo-img-circle {
            height: 55px;
            display: flex;
            align-items: center;
        }

        .logo-img-circle img { height: 100%; width: auto; }

        .header-icons { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            z-index: 2;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            background-color: var(--primary);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            box-shadow: 0 8px 15px rgba(241, 24, 21, 0.2);
        }

        /* --- CARDS SECTION --- */
        .cards-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 40px;
        }

        .row { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }

        .btn-card {
            background: linear-gradient(135deg, #f11815 0%, #b31210 100%);
            color: #ffffff;
            width: 320px;
            height: 200px;
            border: none;
            border-radius: var(--radius);
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(179, 18, 16, 0.25);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        .btn-card i { opacity: 0.8; transition: 0.3s; }

        .btn-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 25px 50px rgba(179, 18, 16, 0.4);
        }

        .btn-card:hover i { transform: scale(1.2); opacity: 1; }

        /* Efeito de brilho */
        .btn-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: 0.6s;
        }
        .btn-card:hover::before { left: 100%; }

    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="menu-header">
            <h2 style="font-size: 18px; font-weight: 800; color: var(--text-main);">MENU</h2>
            <button class="btn-toggle" onclick="toggleMenu()">
                <i data-lucide="x"></i>
            </button>
        </div>
        <nav class="nav-links">            
            <a href=""><i data-lucide="user"></i> Meu perfil</a>
            <a href="#"><i data-lucide="lightbulb"></i> Sugestões</a>
            <a href="#"><i data-lucide="mail"></i> Contato</a>
            <a href="admin.html" class="admin-btn"><i data-lucide="shield-check"></i> Administrador</a>
        </nav>
    </aside>

    <div class="main-content">
        <header class="top-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <button class="btn-toggle" id="openBtn" onclick="toggleMenu()" style="display: none;">
                    <i data-lucide="menu"></i>
                </button>
                
                <div class="search-area">
                    <i data-lucide="search" size="18" color="#64748b"></i>
                    <input type="text" placeholder="O que você procura?">
                </div>
            </div>

            <div class="logo-central">
                <span class="logo-text">AAPM</span>
                <div class="logo-img-circle">
                    <img src="fotoss.png" alt="Logo">
                </div>
                <span class="logo-text">SENAI</span>
            </div>

            <div class="header-icons">
                <button class="btn-toggle"><i data-lucide="bell"></i></button>
                <div class="user-avatar"><i data-lucide="user" size="24"></i></div>
            </div>
        </header>

        <section class="cards-section">
            <div class="row">
                <a href="page.html" class="btn-card">
                    <i data-lucide="book-open" size="40"></i>
                    História da AAPM
                </a>                
                <a href="eventos.html" class="btn-card">
                    <i data-lucide="calendar" size="40"></i>
                    Eventos
                </a>
                <a href="#" class="btn-card">
                    <i data-lucide="award" size="40"></i>
                    Benefícios
                </a>
            </div>
            <div class="row">
                <a href="#" class="btn-card">
                    <i data-lucide="layers" size="40"></i>
                    Oficinas
                </a>
                <a href="#" class="btn-card">
                    <i data-lucide="megaphone" size="40"></i>
                    Avisos
                </a>
            </div>
        </section>
    </div>

    <script>
        lucide.createIcons();

        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const openBtn = document.getElementById('openBtn');
            
            sidebar.classList.toggle('closed');
            
            if (sidebar.classList.contains('closed')) {
                openBtn.style.display = 'flex';
            } else {
                openBtn.style.display = 'none';
            }
        }
    </script>

</body>
</html>
