<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="admin_sessao.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrador - AAPM SENAI</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f11815;
            --primary-dark: #b31210;
            --bg-body: #f8faff;
            --text-main: #1a1a1a;
            --text-sub: #64748b;
            --radius: 28px;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            --border-color: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-sub);
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: 0.2s;
            width: fit-content;
        }

        .btn-back:hover {
            color: var(--primary);
        }

        .mensagem-erro {
            display: none;
            background-color: #fee2e2;
            border: 1px solid #fca5a5;
            color: #b91c1c;
            padding: 16px 20px;
            border-radius: 18px;
            font-size: 15px;
            font-weight: 700;
            align-items: center;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background-color: #ffffff;
            padding: 50px 45px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(0, 0, 0, 0.05);
            width: 100%;
        }

        .card-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-central {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .logo-text {
            color: var(--primary);
            font-weight: 800;
            font-size: 32px;
            letter-spacing: -1px;
        }

        .logo-img-circle {
            height: 52px;
            display: flex;
            align-items: center;
        }

        .logo-img-circle img {
            height: 100%;
            width: auto;
        }

        .card-header h2 {
            color: var(--text-main);
            font-size: 24px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .card-header p {
            color: var(--text-sub);
            font-size: 15px;
            margin-top: 6px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-group label {
            color: var(--text-main);
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-icon-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon-wrapper i {
            position: absolute;
            left: 18px;
            color: var(--text-sub);
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 16px 18px 16px 52px;
            border: 1.5px solid var(--border-color);
            border-radius: 16px;
            font-size: 15px;
            outline: none;
            color: var(--text-main);
            font-weight: 600;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        .form-group input:focus {
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(241, 24, 21, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #f11815 0%, #b31210 100%);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 10px 25px rgba(241, 24, 21, 0.25);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(241, 24, 21, 0.35);
        }

        .links-uteis {
            margin-top: 28px;
            display: flex;
            justify-content: center;
        }

        .links-uteis a {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            transition: 0.2s;
        }

        .links-uteis a:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <a href="landingpage.html" class="btn-back">
            <i data-lucide="arrow-left" size="20"></i> Voltar ao início
        </a>

        <div id="mensagem-erro" class="mensagem-erro">
            <i data-lucide="alert-circle" size="22"></i>
            <span id="texto-erro"></span>
        </div>

        <div class="login-card">
            <div class="card-header">
                <div class="logo-central">
                    <span class="logo-text">AAPM</span>
                    <div class="logo-img-circle">
                        <img src="fotoss.png" alt="Logo" onerror="this.style.display='none'">
                    </div>
                    <span class="logo-text">SENAI</span>
                </div>
                <h2><i data-lucide="shield-check" color="#f11815" size="26"></i> Painel do Administrador</h2>
                <p>Acesso restrito para gestão e verificação</p>
            </div>

            <form id="form-login-admin" onsubmit="efetuarLoginAdmin(event)">
                <div class="form-group">
                    <label for="login">Login de Usuário</label>
                    <div class="input-icon-wrapper">
                        <i data-lucide="user" size="20"></i>
                        <input type="text" id="login" placeholder="Digite seu login" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="senha">Senha de Acesso</label>
                    <div class="input-icon-wrapper">
                        <i data-lucide="lock" size="20"></i>
                        <input type="password" id="senha" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmitAdmin">
                    <i data-lucide="log-in" size="20"></i> ACESSAR PAINEL
                </button>

                <div class="links-uteis">
                    <a href="esqueci_senha_admin.html">Esqueci minha senha</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Limpa APENAS os dados de sessão do admin sem apagar o histórico do chat
        localStorage.removeItem("token");
        localStorage.removeItem("tipoUsuario");
        localStorage.removeItem("nomeUsuario");

        if (window.lucide) lucide.createIcons();

        function finalizarAcessoAdmin(token, nomeAdmin) {
            localStorage.setItem("token", token);
            localStorage.setItem("tipoUsuario", "admin");
            localStorage.setItem("nomeUsuario", nomeAdmin);
            
            // Garante compatibilidade caso a landing page verifique usuarioLogado
            localStorage.setItem("usuarioLogado", JSON.stringify({
                nome: nomeAdmin,
                nome_completo: nomeAdmin,
                tipo: "admin"
            }));

            // Direciona diretamente para a landing page
            window.location.replace("landingpage.html");
        }

        async function efetuarLoginAdmin(event) {
            event.preventDefault();

            const loginInput = document.getElementById("login").value.trim();
            const senhaInput = document.getElementById("senha").value.trim();
            const caixaErro = document.getElementById("mensagem-erro");
            const textoErro = document.getElementById("texto-erro");
            const btnSubmit = document.getElementById("btnSubmitAdmin");

            caixaErro.style.display = "none";
            textoErro.innerText = "";
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = 'ENTRANDO...';

            try {
                const resposta = await fetch("http://127.0.0.1:3002/login-admin", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ login: loginInput, senha: senhaInput })
                });

                const dados = await resposta.json();

                if (resposta.ok && dados.sucesso) {
                    finalizarAcessoAdmin(dados.token, dados.usuario || "Administrador Master");
                } else {
                    textoErro.innerText = dados.resposta || "Usuário ou senha incorretos.";
                    caixaErro.style.display = "flex";
                }
            } catch (erro) {
                console.warn("Servidor offline, verificando acesso local...");
                
                // Fallback local caso o backend Node.js não esteja rodando
                if ((loginInput === "admin" || loginInput === "admin@senai.br") && (senhaInput === "admin" || senhaInput === "123456")) {
                    finalizarAcessoAdmin("token-admin-local", "Administrador Master");
                } else {
                    textoErro.innerText = "Erro ao conectar com o servidor. (Para teste offline, use login 'admin' e senha 'admin')";
                    caixaErro.style.display = "flex";
                }
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<i data-lucide="log-in" size="20"></i> ACESSAR PAINEL';
                if (window.lucide) lucide.createIcons();
            }
        }
    </script>
</body>
</html>
