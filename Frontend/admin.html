<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - AAPM SENAI</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f11815;
            --primary-dark: #b31210;
            --bg-body: #f8faff;
            --sidebar-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-sub: #64748b;
            --radius: 24px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--bg-body);
            color: var(--text-main);
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            padding: 20px;
        }

        .sidebar.closed {
            width: 0;
            padding: 0;
            opacity: 0;
            pointer-events: none;
        }

        .sidebar-header {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-links a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 18px;
            text-decoration: none;
            color: var(--text-sub);
            font-size: 16px;
            font-weight: 600;
            border-radius: 16px;
            transition: all 0.3s;
        }

        /* Ajuste específico para os ícones do menu lateral */
        .nav-links a i {
            width: 20px;
            height: 20px;
        }

        .nav-links a:hover {
            background-color: #fff1f1;
            color: var(--primary);
        }

        .nav-links a.active {
            background-color: var(--primary);
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(241, 24, 21, 0.2);
        }

        .nav-links a.active i {
            color: #ffffff;
        }

        /* Estilo para o link de Administrador (Destaque igual à landing page) */
        .nav-links a.admin-btn {
            margin-top: 10px;
            background-color: #f1f5f9;
            color: var(--primary);
            border: 1px dashed var(--primary);
        }

        /* --- BOTÃO MENU (HAMBÚRGUER) --- */
        .btn-toggle {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-sub);
            padding: 10px;
            border-radius: 12px;
            transition: 0.3s;
            display: flex;
            align-items: center;
        }

        .btn-toggle:hover {
            background: #f1f5f9;
            color: var(--primary);
        }

        /* --- CONTEÚDO PRINCIPAL --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .top-header {
            height: 90px;
            background-color: #ffffff;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .search-bar {
            background: #f1f5f9;
            padding: 12px 20px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 300px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .search-bar:focus-within {
            border-color: var(--primary);
            background: #ffffff;
            width: 350px;
            box-shadow: var(--shadow);
        }

        .search-bar input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-weight: 600;
            color: var(--text-main);
        }

        .logo-central {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-text { 
            color: var(--primary); 
            font-weight: 800; 
            font-size: 32px; 
            letter-spacing: -1px;
        }

        .user-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            background-color: var(--primary);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            box-shadow: 0 8px 15px rgba(241, 24, 21, 0.2);
        }

        /* --- GRID DE CARDS --- */
        .dashboard-container {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .btn-card {
            background: #ffffff;
            color: var(--text-main);
            padding: 40px 30px;
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: var(--radius);
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            text-align: center;
        }

        .btn-card i {
            color: var(--primary);
            transition: 0.3s;
        }

        .btn-card:hover {
            transform: translateY(-8px);
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .btn-card:hover i {
            color: #ffffff;
            transform: scale(1.1);
        }

        .btn-card.special {
            background: #1e293b;
            color: #ffffff;
        }

        .btn-card.special i { color: #38bdf8; }

        .btn-card.special:hover {
            background: #0f172a;
        }

    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2 style="font-size: 18px; font-weight: 800; color: var(--text-main);">MENU</h2>
            <button class="btn-toggle" onclick="toggleMenu()">
                <i data-lucide="x"></i>
            </button>
        </div>
        <nav class="nav-links">
            <a href="landingpage.html"><i data-lucide="home"></i> Tela Inicial</a>
            <a href="perfiladmin.html"><i data-lucide="user"></i> Meu Perfil</a>
            <a href="#"><i data-lucide="lightbulb"></i> Sugestões</a>
            <a href="#"><i data-lucide="mail"></i> Contato</a>
            <a href="#" class="active admin-btn"><i data-lucide="shield-check"></i> Administrador</a>
        </nav>
    </aside>

    <div class="main-content">
        <header class="top-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <button class="btn-toggle" id="openBtn" onclick="toggleMenu()" style="display: none;">
                    <i data-lucide="menu"></i>
                </button>
                <div class="search-bar">
                    <i data-lucide="search" size="18" color="#64748b"></i>
                    <input type="text" placeholder="Buscar no painel...">
                </div>
            </div>

            <div class="logo-central">
                <span class="logo-text">AAPM</span>
                <img src="fotoss.png" alt="Logo" style="height: 50px;">
                <span class="logo-text">SENAI</span>
            </div>

            <div class="user-actions">
                <button class="btn-toggle"><i data-lucide="bell"></i></button>
                <div class="user-avatar"><i data-lucide="user" size="24"></i></div>
            </div>
        </header>

        <div class="dashboard-container">
            <div class="cards-grid">
                <a href="page.html" class="btn-card">
                    <i data-lucide="book-open" size="32"></i>
                    História da AAPM
                </a>
                <a href="eventos.html?admin=true" class="btn-card">
                    <i data-lucide="calendar" size="32"></i>
                    Eventos
                </a>
                <a href="#" class="btn-card">
                    <i data-lucide="award" size="32"></i>
                    Benefícios
                </a>
                <a href="#" class="btn-card">
                    <i data-lucide="layers" size="32"></i>
                    Oficinas
                </a>
                <a href="#" class="btn-card">
                    <i data-lucide="megaphone" size="32"></i>
                    Avisos
                </a>
                <a href="contribuintes.html" class="btn-card special">
                    <i data-lucide="users" size="32"></i>
                    Lista de Contribuintes
                </a>
            </div>
        </div>
    </div>

    <script>
        // Inicializa os ícones Lucide
        lucide.createIcons();

        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const openBtn = document.getElementById('openBtn');
            
            sidebar.classList.toggle('closed');
            
            if (sidebar.classList.contains('closed')) {
                openBtn.style.display = 'flex';
            } else {
                openBtn.style.display = 'none';
            }
        }
    </script>
</body>
</html>
